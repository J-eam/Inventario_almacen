<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROESA - Sistema de Inventario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Tokens del sistema de diseño PROESA (Grupo-PROESA/proesa-design-system) -->
    <link href="css/proesa-tokens.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <!-- ═══ LOGIN ═══ -->
    <div id="loginView" class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="brand-mark brand-mark--lg"><i class="bi bi-boxes"></i></div>
                    <h1>Sistema de Inventario</h1>
                    <p>PROESA</p>
                </div>
                <div id="loginAlert" class="alert alert-danger d-none py-2"></div>
                <div id="loginFormDiv">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" id="loginUser" class="form-control" placeholder="Tu usuario" autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" id="loginPass" class="form-control" placeholder="Tu contraseña"
                                   onkeydown="if(event.key==='Enter')login()">
                        </div>
                    </div>
                    <button onclick="login()" class="btn btn-proesa w-100" id="loginBtn">Iniciar sesión</button>
                </div>
                <hr>
                <div id="setupToggle" class="text-center">
                    <a href="#" onclick="toggleSetup(true);return false" class="small text-muted">
                        ¿Primera vez? Configura el sistema
                    </a>
                </div>
                <div id="setupFormDiv" class="d-none">
                    <h6 class="text-proesa mb-3">Configuración inicial</h6>
                    <div class="mb-2">
                        <input type="text" id="setupNombre" class="form-control" placeholder="Tu nombre completo">
                    </div>
                    <div class="mb-2">
                        <input type="text" id="setupUser" class="form-control" placeholder="Usuario (ej: admin)">
                    </div>
                    <div class="mb-3">
                        <input type="password" id="setupPass" class="form-control" placeholder="Contraseña (mínimo 6 caracteres)">
                    </div>
                    <button onclick="setupAdmin()" class="btn btn-success w-100">Crear admin y cargar datos</button>
                    <button onclick="toggleSetup(false)" class="btn btn-link w-100 mt-1 small">Cancelar</button>
                </div>
            </div>
            <p class="login-footer">PROESA Soluciones en Salud</p>
        </div>
    </div>

    <!-- ═══ APP ═══ -->
    <div id="appView" class="app-shell" style="display:none">
        <aside id="sidebar" class="sidebar"></aside>
        <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="toggleSidebar(false)"></div>
        <div class="app-main">
            <header class="app-header">
                <div class="d-flex align-items-center gap-3 min-w-0">
                    <button class="btn-icon d-lg-none" onclick="toggleSidebar(true)" aria-label="Abrir menú">
                        <i class="bi bi-list"></i>
                    </button>
                    <h1 id="headerTitle" class="app-header__title">Sistema de Inventario</h1>
                </div>
                <div id="headerUser" class="app-header__user"></div>
            </header>
            <div id="alertContainer" class="app-alerts"></div>
            <main id="mainContent" class="app-content"></main>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <!-- ExcelJS for styled Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <!-- FileSaver for download -->
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App -->
    <script src="js/app.js"></script>
</body>
</html>
